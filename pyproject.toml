[project]
name = "zoomcamp-llm-2026"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deltalake>=1.6.2",
    "dlt[duckdb,hub]>=1.29.1",
    "elasticsearch>=8.19.3",
    "flask>=3.1.3",
    "gitsource>=0.0.5",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-elasticsearch>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "logfire>=4.39.0",
    "marimo>=0.23.15",
    "minsearch>=0.1.1",
    "numpy>=2.5.0",
    "onnxruntime>=1.27.0",
    "openai>=2.43.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai>=2.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=3.0.0",
    "sqlitesearch>=0.1.1",
    "streamlit>=1.59.2",
    "tokenizers>=0.22.0,<=0.23.0",
    "toyaikit>=0.0.11",
    "tqdm>=4.68.3",
]

[tool.uv]
environments = ["sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "huggingface-hub>=1.21.0",
    "jupyter>=1.1.1",
]
