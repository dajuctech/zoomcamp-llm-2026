services:
  app:
    build:
      context: ../..
      dockerfile: 07-project-example/fitness-assistant/Dockerfile
    container_name: fitness-assistant-app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_DB: fitness_assistant
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Europe/London
      PORT: 5000
    ports:
      - "${APP_PORT:-5001}:5000"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: fitness-assistant-postgres
    environment:
      POSTGRES_DB: fitness_assistant
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fitness_assistant_postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: fitness-assistant-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - fitness_assistant_grafana_data:/var/lib/grafana
    depends_on:
      - postgres

volumes:
  fitness_assistant_postgres_data:
  fitness_assistant_grafana_data:
